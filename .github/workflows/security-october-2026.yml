name: Emergency CVE lockfile regeneration
on:
  push:
    branches:
      - security/oct-2026-runtime-cves
permissions:
  contents: write
jobs:
  regenerate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: pnpm
      - name: Resolve patched dependencies and regenerate pnpm lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Verify patched Next.js is locked
        run: grep -F 'next@16.4.3:' pnpm-lock.yaml
      - name: Install fully frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Check installed framework version
        run: node -e "const v=require('next/package.json').version; if(v!=='16.4.3') process.exit(1)"
      - name: Run regression checks
        run: pnpm typecheck && pnpm test
      - name: Commit regenerated lockfile to security branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "security: regenerate lockfile for patched Next.js 16.4.3"
            git push origin HEAD:security/oct-2026-runtime-cves
          fi
